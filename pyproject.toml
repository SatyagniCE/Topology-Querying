[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-querying"
version = "0.1.0"
description = "Parse, store, query, and visualize analog circuit topology"
requires-python = ">=3.11"
dependencies = ["networkx>=3,<4", "pyvis>=0.3.2,<0.4", "pydantic>=2,<3"]

[project.scripts]
circuit-ingest = "circuit_ingest.cli:main"
circuit-neo4j = "circuit_ingest.neo4j_cli:main"
circuit-networkx = "circuit_ingest.networkx_corpus:main"
circuit-html = "circuit_ingest.html_export:main"
circuit-workbench = "circuit_workbench.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
neo4j = ["neo4j>=6,<7"]
workbench = [
    "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
    "fastembed>=0.7,<1", "numpy>=1.26,<3", "Pillow>=10,<13",
    "python-multipart>=0.0.20,<1", "neo4j>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
circuit_ingest = ["assets/*.txt"]
circuit_workbench = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
