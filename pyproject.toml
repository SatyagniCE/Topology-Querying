[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-querying"
version = "0.1.0"
description = "Parse analog .cir netlists into deterministic device graphs"
requires-python = ">=3.11"
dependencies = ["networkx>=3,<4", "pyvis>=0.3.2,<0.4", "pydantic>=2,<3"]

[project.scripts]
circuit-ingest = "circuit_ingest.cli:main"
circuit-neo4j = "circuit_ingest.neo4j_cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
neo4j = ["neo4j>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
